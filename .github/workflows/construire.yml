name: Construire Nova OS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Construire l'image
        run: bash construire-nova-os.sh
        env:
          NOVA_OS_VERSION: ${{ github.run_number }}
          NOVA_OS_DEPOT: ${{ github.repository }}

      - name: Publier nova-os.iso
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-os-${{ github.run_number }}
          name: Nova OS (construction ${{ github.run_number }})
          body: Image de Nova OS à écrire sur une clé USB avec Rufus (voir LISEZMOI). Si l'image est en morceaux, télécharge-les tous avec recoller-nova-os.bat dans le même dossier et double-clique sur le .bat.
          files: |
            nova-os.iso
            nova-os.iso.morceau*
            recoller-nova-os.bat
            publie/*

      - name: Garder le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-construction
          path: construction.log
